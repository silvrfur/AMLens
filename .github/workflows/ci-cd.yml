# Tests every pull request and push; on main, builds the images in Azure Container Registry
# and rolls them out: migrations, then RAG, then the backend, then the frontend.
#
# One-time setup (DEPLOY.md, "CI/CD"): provision with infra/deploy.ps1, create an Entra ID app with
# a federated credential for this repo's `production` environment, give it Contributor on the
# resource group, and set these repository variables (not secrets; OIDC needs no stored password):
#   AZURE_CLIENT_ID  AZURE_TENANT_ID  AZURE_SUBSCRIPTION_ID  AZURE_RESOURCE_GROUP  AZURE_ACR_NAME
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amlens
          POSTGRES_PASSWORD: amlens_dev
          POSTGRES_DB: amlens_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U amlens -d amlens_test"
          --health-interval 5s --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      # Throwaway CI database ("test" in the name: the suites wipe it).
      TEST_DATABASE_URL: postgresql+psycopg://amlens:amlens_dev@127.0.0.1:5433/amlens_test
      AML_AGENT_TEST_DATABASE_URL: postgresql://amlens:amlens_dev@127.0.0.1:5433/amlens_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # same as the backend and RAG images
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            agents/requirements.txt

      - name: Install backend + agents
        run: pip install -r backend/requirements.txt -r agents/requirements.txt

      - name: Agent tests (SQLite and PostgreSQL stores)
        run: python -m pytest agents/tests -q

      - name: Backend tests (mock LLM/RAG, real PostgreSQL)
        working-directory: backend
        run: python -m pytest -q

      - name: RAG imports without the FAISS/torch stack (Azure image contents)
        run: |
          python -m venv /tmp/rag && /tmp/rag/bin/pip install -q -r RAG/requirements-azure.txt
          cd RAG && RAG_BACKEND=azure AZURE_SEARCH_ENDPOINT=https://example.search.windows.net \
            AZURE_SEARCH_INDEX_NAME=x AZURE_OPENAI_BASE_URL=https://example.openai.azure.com/openai/v1/ \
            AZURE_OPENAI_API_KEY=x AZURE_SEARCH_ADMIN_KEY=x \
            /tmp/rag/bin/python -c "from app.main import app; print('rag ok')"

      - uses: pnpm/action-setup@v4          # version from frontend/package.json "packageManager"
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"                 # same as the frontend image
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend type-check and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_USE_MOCKS: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production                 # add required reviewers here to gate releases
    permissions:
      contents: read
      id-token: write                       # OIDC sign-in to Azure, no stored credentials
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build images in ACR
        run: |
          az acr build -r "$ACR" -t "amlens-rag:$TAG" RAG -o none
          az acr build -r "$ACR" -t "amlens-backend:$TAG" -f backend/Dockerfile . -o none
          az acr build -r "$ACR" -t "amlens-frontend:$TAG" frontend -o none

      - name: Run database migrations (inside the VNet)
        run: |
          IMG="$ACR.azurecr.io/amlens-backend:$TAG"
          az containerapp job update -n amlens-migrate -g "$RG" --image "$IMG" -o none
          EXEC=$(az containerapp job start -n amlens-migrate -g "$RG" --query name -o tsv)
          for i in $(seq 1 90); do
            STATUS=$(az containerapp job execution show -n amlens-migrate -g "$RG" --job-execution-name "$EXEC" --query properties.status -o tsv)
            echo "migrate: $STATUS"
            [ "$STATUS" = "Succeeded" ] && exit 0
            [ "$STATUS" = "Failed" ] && exit 1
            sleep 10
          done
          exit 1

      - name: Roll out RAG, then backend, then frontend
        run: |
          for APP in rag backend frontend; do
            az containerapp update -n "amlens-$APP" -g "$RG" --image "$ACR.azurecr.io/amlens-$APP:$TAG" -o none
            REV=$(az containerapp show -n "amlens-$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
            for i in $(seq 1 30); do
              STATE=$(az containerapp revision show -n "amlens-$APP" -g "$RG" --revision "$REV" --query properties.runningState -o tsv)
              echo "$APP $REV: $STATE"
              case "$STATE" in Running*) break;; Failed|Degraded) exit 1;; esac
              sleep 10
            done
          done

      - name: Smoke test through the public frontend
        run: |
          FQDN=$(az containerapp show -n amlens-frontend -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 18); do
            H=$(curl -fsS "https://$FQDN/api/backend/health" || true)
            echo "$H"
            echo "$H" | jq -e '.backend=="healthy" and .agent=="healthy" and .rag=="healthy"' >/dev/null && exit 0
            sleep 10
          done
          exit 1

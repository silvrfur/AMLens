# Alembic config for the main AML PostgreSQL database.
# The database URL is NOT stored here; alembic/env.py reads DATABASE_URL
# (from the environment or backend/.env).
#
# Usage (from the backend/ folder):
#   alembic upgrade head        # create / update tables
#   alembic current             # show applied version
#   alembic revision -m "msg"   # new migration (then edit the generated file)

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

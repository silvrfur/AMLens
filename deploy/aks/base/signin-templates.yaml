# AMLens-branded pages for the sign-in proxy (oauth2-proxy --custom-templates-dir).
# Username/password only: the tenant requires admin consent for Entra ID apps, so the
# "Sign in with Microsoft" button is not shown. Go templates; values are HTML-escaped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signin-templates
  namespace: amlens
data:
  sign_in.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Sign in · AMLens</title>
      <style>
        :root { --bg:#f4f6f8; --card:#fff; --ink:#14213d; --muted:#5b6475; --line:#d9dee5; --brand:#1d3557; --err:#b42318; }
        @media (prefers-color-scheme: dark) { :root { --bg:#0f1520; --card:#171f2d; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3546; --brand:#7fa7d9; --err:#f97066; } }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
        main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px 28px; }
        h1 { font-size:20px; margin:0 0 4px; } p { margin:0 0 24px; color:var(--muted); font-size:14px; }
        .brand { font-weight:700; letter-spacing:.02em; color:var(--brand); margin-bottom:20px; }
        label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
        input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
        input:focus { outline:2px solid var(--brand); outline-offset:1px; }
        button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
        .msg { color:var(--err); font-size:13px; margin-top:12px; } footer { margin-top:20px; font-size:12px; color:var(--muted); }
      </style>
    </head>
    <body>
      <main>
        <div class="brand">AMLens</div>
        <h1>Sign in</h1>
        <p>AML investigation workspace. Authorised analysts only.</p>
        <form method="POST" action="{{.ProxyPrefix}}/sign_in">
          <input type="hidden" name="rd" value="{{.Redirect}}">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
          {{ if .SignInMessage }}<div class="msg">{{.SignInMessage}}</div>{{ end }}
        </form>
        <footer>All activity is recorded in the audit trail.</footer>
      </main>
    </body>
    </html>
  error.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{.StatusCode}} · AMLens</title>
      <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif;padding:16px;background:#f4f6f8;color:#14213d}
      main{max-width:420px;background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:28px}a{color:#1d3557}
      @media (prefers-color-scheme: dark){body{background:#0f1520;color:#e7ecf3}main{background:#171f2d;border-color:#2a3546}a{color:#7fa7d9}}</style>
    </head>
    <body><main>
      <h1>{{.Title}}</h1>
      <p>{{.Message}}</p>
      <p><a href="{{.ProxyPrefix}}/sign_in">Sign in again</a></p>
    </main></body>
    </html>

# PostgreSQL 16 inside the cluster (the sandbox does not allow Azure Database for PostgreSQL).
# Data lives on an Azure managed disk (PersistentVolumeClaim); the backup CronJob in
# backup.yaml dumps it nightly. Reachable only from pods labelled amlens.io/db-client=true.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      securityContext:
        fsGroup: 999                     # postgres user in the official image
      containers:
        - name: postgres
          image: __ACR__/library/postgres:16-alpine   # imported into ACR by deploy.sh
          env:
            - { name: POSTGRES_DB, value: amlens }
            - { name: POSTGRES_USER, value: amlens }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: amlens-db, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "amlens", "-d", "amlens"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "amlens", "-d", "amlens"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi    # Azure managed disk
        resources:
          requests: { storage: 8Gi }

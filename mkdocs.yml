site_name: AMLens Documentation
site_description: User and developer documentation for AMLens, an AI-assisted anti-money-laundering alert investigation workspace.
repo_url: https://github.com/silvrfur/AMLens
repo_name: silvrfur/AMLens
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/stylesheets/amlens.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Home: index.md
  - User guide:
      - user-guide/index.md
      - Introduction: user-guide/introduction.md
      - Getting started: user-guide/getting-started.md
      - Account and sign-in: user-guide/account-and-login.md
      - Navigation and dashboard: user-guide/navigation-and-dashboard.md
      - Features:
          - Upload transaction data: user-guide/features/upload-data.md
          - Alert queue: user-guide/features/alert-queue.md
          - Reviewing an alert: user-guide/features/alert-review.md
          - AI investigation: user-guide/features/ai-investigation.md
